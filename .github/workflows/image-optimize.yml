name: Optimize portfolio images

on:
  push:
    branches:
      - main
    paths:
      - "IMG_20251228_164915_1.jpg"
      - "IMG_20251228_164918.jpg"
      - ".github/workflows/image-optimize.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install image optimizer
        run: npm install --no-save sharp

      - name: Optimize original portfolio photos
        run: |
          node <<'NODE'
          const sharp = require("sharp");
          const fs = require("node:fs/promises");

          const files = [
            "IMG_20251228_164915_1.jpg",
            "IMG_20251228_164918.jpg"
          ];

          (async () => {
            for (const file of files) {
              const temp = file + ".optimized.jpg";
              await sharp(file)
                .rotate()
                .resize({ width: 1600, height: 1600, fit: "inside", withoutEnlargement: true })
                .jpeg({ quality: 78, mozjpeg: true, progressive: true })
                .toFile(temp);
              await fs.rename(temp, file);
            }
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Commit optimized images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add IMG_20251228_164915_1.jpg IMG_20251228_164918.jpg
          if git diff --cached --quiet; then
            echo "Images are already optimized."
            exit 0
          fi
          git commit -m "perf(images): compress portfolio profile photos"
          git push origin main
